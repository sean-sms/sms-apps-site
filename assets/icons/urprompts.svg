<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="UrPrompts">
  <defs>
    <linearGradient id="pl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a78"/>
      <stop offset="55%" stop-color="#1b2550"/>
      <stop offset="100%" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="pl-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a1"/>
      <stop offset="55%" stop-color="#ffb43c"/>
      <stop offset="100%" stop-color="#f08a1c"/>
    </linearGradient>
    <filter id="pl-glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#pl-bg)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="28.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>

  <!-- the prompt that was found -->
  <g filter="url(#pl-glow)">
    <rect x="24" y="36" width="80" height="13" rx="6.5" fill="url(#pl-amber)"/>
  </g>
  <!-- the rest of the library -->
  <rect x="24" y="60" width="64" height="11" rx="5.5" fill="#ffffff" fill-opacity=".92"/>
  <rect x="24" y="79" width="72" height="11" rx="5.5" fill="#ffffff" fill-opacity=".62"/>
  <rect x="24" y="98" width="46" height="11" rx="5.5" fill="#ffffff" fill-opacity=".36"/>
</svg>
